<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full BLEED background rectangle covering 100% of 512x512 canvas -->
  <rect width="512" height="512" fill="#020617"/>
  
  <!-- Centered Scaled Maskable Safe Zone Content (65% scale fit inside Android mask circle) -->
  <g transform="translate(89.6, 89.6) scale(0.65)">
    <defs>
      <linearGradient id="grad_mask" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
      </linearGradient>
      <filter id="shadow_mask" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- Inner Main App Gradient Circle -->
    <circle cx="256" cy="256" r="230" fill="url(#grad_mask)" filter="url(#shadow_mask)"/>
    
    <!-- Clock Ring -->
    <circle cx="256" cy="256" r="150" fill="none" stroke="white" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Clock Hands -->
    <path d="M256 136 V256 L336 336" stroke="white" stroke-width="32" stroke-linecap="round" fill="none"/>
    
    <!-- Center Dot -->
    <circle cx="256" cy="256" r="24" fill="white"/>
  </g>
</svg>
