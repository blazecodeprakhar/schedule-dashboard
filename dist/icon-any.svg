<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad_any" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_any" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Transparent Background - Pure Floating Gradient Circle Icon for Home Screen -->
  <circle cx="256" cy="256" r="240" fill="url(#grad_any)" filter="url(#shadow_any)"/>
  
  <!-- Clock Ring -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="white" stroke-width="30" stroke-linecap="round"/>
  
  <!-- Clock Hands -->
  <path d="M256 140 V256 L334 334" stroke="white" stroke-width="30" stroke-linecap="round" fill="none"/>
  
  <!-- Center Dot -->
  <circle cx="256" cy="256" r="22" fill="white"/>
</svg>
