<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Full Canvas Background for Android Maskable Splash Screen -->
  <rect width="512" height="512" fill="#020617" />
  
  <!-- Main App Gradient Circle centered within safe zone (r=165 = ~65% of canvas) -->
  <circle cx="256" cy="256" r="165" fill="url(#grad_bg)" />
  
  <!-- Clock Ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Clock Hands -->
  <path d="M256 178 V256 L308 308" stroke="white" stroke-width="20" stroke-linecap="round" fill="none"/>
  
  <!-- Center Dot -->
  <circle cx="256" cy="256" r="14" fill="white"/>
</svg>
